name: Build and Deploy C++ Generated Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 音游谱面内核：同一份 C++ 源码编译成 WebAssembly。
      # 两步都 continue-on-error：万一 emsdk 装不上，仓库里那份 732 B 的
      # rhythm_core.wasm 会被生成器内联，站点照常发布（音游退回 JS 谱面 + JS 判定）。
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        continue-on-error: true
        with:
          version: 3.1.61

      - name: Compile rhythm kernel to WebAssembly
        continue-on-error: true
        run: |
          emcc rhythm_core.cpp -O3 -o rhythm_core.wasm --no-entry \
            -sSTANDALONE_WASM=1 -sERROR_ON_UNDEFINED_SYMBOLS=1
          ls -l rhythm_core.wasm

      - name: Compile and run C++ generator
        run: |
          g++ -std=c++17 -O2 -o generator main.cpp
          ./generator

      - name: Assemble publish directory
        run: |
          mkdir -p _site
          cp index.html 404.html robots.txt sitemap.xml favicon.svg _site/
          cp kernel.html nojs.html _site/
          cp cover.jpg avatar.jpg bg.webp music.mp3 og-image.jpg _site/
          mkdir -p _site/assets/fonts
          cp assets/fonts/*.woff2 _site/assets/fonts/
          ls -l _site

      # 资产门：三个页面里引用到的每个本地文件都必须真的在 _site 里，
      # 否则宁可让部署失败，也不要发一个图裂的页面出去。
      # 规则放在 tools/asset-gate.mjs 里（src/href、url() 带不带引号、以及藏在
      # <meta content> 里的 og:image —— 靠媒体后缀兜住），本地也能跑同一条命令。
      - name: Gate - every referenced asset must exist
        run: |
          node tools/asset-gate.mjs --dir=_site --html=index.html
          node tools/asset-gate.mjs --dir=_site --html=kernel.html
          node tools/asset-gate.mjs --dir=_site --html=nojs.html

      # 内核契约门：导出齐不齐、版本号、谱面前 12 个轨道、判定窗口边界、
      # 准确率权重——页面里那份「自检 ok」的徽章就是拿这些当依据的。
      - name: Gate - wasm kernel contract
        run: node tools/wasm-check.mjs

      # 首屏体积门禁：超预算就让 CI 红，别等用户发现页面变重。
      - name: Gate - first load size budget
        run: node tools/budget.mjs

      # 字体子集覆盖门：改了标题/引言文字却没重新子集时，那个字会悄悄回退成
      # 系统楷体——肉眼几乎看不出，这里让它变成一条红色。
      - name: Gate - subset font coverage
        run: node tools/font-coverage.mjs --dir=_site

      # 谱面时间轴门：音游的谱面来自 onsets.txt 里实测的起音点，生成器把它内联进
      # index.html。换了歌却忘了重跑 tools/onsets.mjs、或者改了文件没重新编译生成器，
      # 谱面就会静悄悄地落到歌外面——这里让这种情况直接红掉。
      - name: Gate - rhythm timeline matches onsets.txt
        run: node tools/rhythm-gate.mjs --dir=_site --onsets=onsets.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
