<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自我介绍</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { font-size: 28px; margin-bottom: 4px; color: #1a1a2e; }
        .title { color: #667eea; font-weight: 600; margin-bottom: 20px; }
        .bio { color: #555; line-height: 1.7; margin-bottom: 24px; }
        .meta { display: flex; gap: 24px; margin-bottom: 24px; }
        .meta-item { text-align: center; }
        .meta-value { font-size: 24px; font-weight: 700; color: #1a1a2e; }
        .meta-label { font-size: 12px; color: #999; text-transform: uppercase; }
        .skills { display: flex; flex-wrap: wrap; gap: 8px; }
        .skill {
            background: #f0f0ff;
            color: #667eea;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        .loading { text-align: center; color: #999; }
    </style>
</head>
<body>
    <div class="card" id="app">
        <p class="loading">加载中...</p>
    </div>

    <script>
        var Module = {
            onRuntimeInitialized: function() {
                var name = Module.UTF8ToString(Module._getName());
                var title = Module.UTF8ToString(Module._getTitle());
                var bio = Module.UTF8ToString(Module._getBio());
                var years = Module._getYearsOfExperience();
                var skills = JSON.parse(Module.UTF8ToString(Module._getSkills()));

                var skillTags = skills.map(function(s) {
                    return '<span class="skill">' + s + '</span>';
                }).join('');

                document.getElementById('app').innerHTML =
                    '<h1>' + name + '</h1>' +
                    '<p class="title">' + title + '</p>' +
                    '<p class="bio">' + bio + '</p>' +
                    '<div class="meta">' +
                        '<div class="meta-item">' +
                            '<div class="meta-value">' + years + '</div>' +
                            '<div class="meta-label">年经验</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="skills">' + skillTags + '</div>';
            }
        };
    </script>
    <script src="main.js"></script>
</body>
</html>
